name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Allows re-running a red build without pushing an empty commit.
  workflow_dispatch:

# A new push to a PR makes the in-flight run irrelevant. Never cancel on main:
# those runs are the record of what was merged.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Each check runs even if an earlier one fails, so a single CI run
      # reports every problem instead of only the first.
      - name: Type-check
        if: '!cancelled()'
        run: npm run type-check

      - name: Lint
        if: '!cancelled()'
        run: npm run lint

      - name: Format check
        if: '!cancelled()'
        run: npm run format:check

  build:
    name: Build and end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # Only Chromium is needed; the mobile project uses it too. Skipping
      # firefox and webkit keeps this step under a minute.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: '!cancelled()'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
